# Schema for the `speed_channels:` section of HERMES_HOME/config.yaml.
#
# This file documents the shape — the plugin does NOT auto-load config from its
# own directory. Copy the keys below into HERMES_HOME/config.yaml (same
# convention as quota_channels). The home_server plugin writes guild_id,
# category_id and channel_ids automatically after provisioning the Speeds
# category, so hand-editing is only needed for a standalone setup.

speed_channels:
  guild_id: ""
  category_id: ""

  # Minimum seconds between vitals ticks. The tick itself runs every few
  # minutes; this self-gates the cheap reads and the Discord renames.
  poll_interval_seconds: 600

  # Interface the WAN rate is read from; empty resolves the default route
  # at tick time. The rate is a 3 s delta of the interface's own byte
  # counters, so nothing is downloaded.
  wan_interface: ""

  # LAN IPs of Shelly PlusPlugS plugs. An offline plug is fine: the Power
  # channel sums the plugs that answer and shows "N/M online".
  shelly_hosts: []

  # Optional. Defaults to HERMES_HOME/state.db (Hermes's session store, opened
  # read-only). Set it only when the database lives somewhere else.
  # state_db: ""

  channel_ids:
    power: ""
    wan: ""
    spend: ""
    agents: ""
